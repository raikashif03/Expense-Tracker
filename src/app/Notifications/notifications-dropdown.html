<div class="notif-dropdown-wrapper" *ngIf="notifService.isOpen$ | async" (click)="$event.stopPropagation()">
  <div class="notif-header">
    <div class="header-left">
      <h3 class="notif-title">Notifications</h3>
      <span class="unread-pill" *ngIf="(notifService.unreadCount$ | async) as unread">
        {{ unread }} new
      </span>
    </div>
    <button type="button" class="btn-mark-all" (click)="markAll()" *ngIf="(notifService.unreadCount$ | async) as unread">
      Mark all read
    </button>
  </div>

  <div class="notif-list" *ngIf="(notifService.notifications$ | async) as list">
    <div 
      class="notif-item" 
      *ngFor="let item of list" 
      [class.unread]="!item.read"
      (click)="markRead(item)"
    >
      <div class="notif-icon-box" [ngClass]="'icon-' + item.type">
        <span class="material-symbols-outlined">{{ item.icon }}</span>
      </div>

      <div class="notif-content">
        <div class="notif-row-top">
          <span class="item-title">{{ item.title }}</span>
          <span class="item-time">{{ item.time }}</span>
        </div>
        <p class="item-msg">{{ item.message }}</p>
      </div>

      <button type="button" class="btn-remove-item" (click)="remove($event, item.id)" title="Dismiss">
        <span class="material-symbols-outlined">close</span>
      </button>

      <span class="unread-dot" *ngIf="!item.read"></span>
    </div>

    <div class="notif-empty" *ngIf="list.length === 0">
      <span class="material-symbols-outlined empty-bell">notifications_off</span>
      <p>No notifications right now</p>
      <span class="empty-sub">You are all caught up!</span>
    </div>
  </div>

  <div class="notif-footer" *ngIf="(notifService.notifications$ | async)?.length">
    <button type="button" class="btn-clear-all" (click)="clearAll()">
      Clear all notifications
    </button>
  </div>
</div>
