<aside class="sidebar-shell">

  <!-- Top Section: Brand & Primary Action -->
  <div class="sidebar-top">
    <!-- Brand Logo -->
    <div class="brand-header">
      <div class="brand-logo-icon">
        <span class="material-symbols-outlined logo-icon">account_balance</span>
      </div>
      <div class="brand-text-block">
        <span class="brand-title">FinTrack</span>
        <span class="brand-tagline">WEALTH MANAGEMENT</span>
      </div>
    </div>

    <!-- Add Transaction Primary Button -->
    <button type="button" class="btn-sidebar-add" (click)="openAddModal()">
      <span class="material-symbols-outlined plus-icon">add</span>
      <span>Add Transaction</span>
    </button>
  </div>

  <!-- Middle Navigation Links -->
  <nav class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active-nav-link" class="nav-item">
      <span class="material-symbols-outlined nav-icon">dashboard</span>
      <span>Dashboard</span>
    </a>

    <a routerLink="/transactions" routerLinkActive="active-nav-link" class="nav-item">
      <span class="material-symbols-outlined nav-icon">receipt_long</span>
      <span>Transactions</span>
    </a>

    <a routerLink="/analytics" routerLinkActive="active-nav-link" class="nav-item">
      <span class="material-symbols-outlined nav-icon">analytics</span>
      <span>Analytics</span>
    </a>

    <a routerLink="/budgets" routerLinkActive="active-nav-link" class="nav-item">
      <span class="material-symbols-outlined nav-icon">account_balance_wallet</span>
      <span>Budgets</span>
    </a>

    <a routerLink="/categories" routerLinkActive="active-nav-link" class="nav-item">
      <span class="material-symbols-outlined nav-icon">category</span>
      <span>Categories</span>
    </a>

    <a routerLink="/settings" routerLinkActive="active-nav-link" class="nav-item">
      <span class="material-symbols-outlined nav-icon">settings</span>
      <span>Settings</span>
    </a>
  </nav>

  <!-- Bottom Section: Profile & Dark Mode Toggle -->
  <div class="sidebar-footer">
    <div class="divider-line"></div>

    <a routerLink="/settings" routerLinkActive="active-nav-link" class="nav-item">
      <span class="material-symbols-outlined nav-icon">account_circle</span>
      <span>Profile</span>
    </a>

    <button type="button" class="nav-item nav-button-action" (click)="toggleTheme()">
      <span class="material-symbols-outlined nav-icon">
        {{ (themeService.isDarkMode$ | async) ? 'light_mode' : 'dark_mode' }}
      </span>
      <span>{{ (themeService.isDarkMode$ | async) ? 'Light Mode' : 'Dark Mode' }}</span>
    </button>
  </div>

</aside>
